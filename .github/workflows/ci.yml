name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # Lint, format, typecheck, tests, build — and dist/ must match the committed bundle.
      - run: bun run verify

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs the committed bundle exactly as consumers do. These paths need no runner-read
  # credentials; the live API paths are covered below.
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs-on: ${{ steps.no-credentials.outputs.runs-on }}
      build: ${{ steps.pools.outputs.build-runs-on }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: forced
        uses: ./
        with:
          labels: self-hosted, linux
          force: self-hosted

      - id: no-credentials
        uses: ./
        with:
          labels: self-hosted, linux
          fallback: '["ubuntu-latest"]'

      - id: switched-off
        uses: ./
        with:
          labels: ${{ vars.SELF_HOSTED_LABELS_UNSET }}
          fallback: ubuntu-24.04

      # Multi-level chain: disabled provider tier skipped, next runs-on tier wins.
      - id: chain
        uses: ./
        with:
          force: fallback
          candidates: |
            - labels: self-hosted, linux
            - runs-on: blacksmith-4vcpu-ubuntu-2404
              enabled: ${{ vars.SELF_HOSTED_LABELS_UNSET == 'x' }}
            - ubuntu-24.04

      # Dynamic per-pool outputs, from config (as an org variable would provide it).
      - id: pools
        uses: ./
        with:
          force: fallback
          config: |
            pools:
              test: [{ labels: 'self-hosted, arm64' }, ubuntu-24.04-arm]
              build: [{ labels: 'self-hosted, x64' }, ubuntu-latest]

      # Live API, error path: GITHUB_TOKEN cannot read runners (403), so the action
      # must warn and select the fallback instead of failing the job.
      - id: api-error
        uses: ./
        with:
          labels: self-hosted
          scope: repo
          retries: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert outputs
        env:
          FORCED: ${{ steps.forced.outputs.runs-on }}
          FORCED_SELF_HOSTED: ${{ steps.forced.outputs.self-hosted }}
          FALLBACK: ${{ steps.no-credentials.outputs.runs-on }}
          FALLBACK_SELF_HOSTED: ${{ steps.no-credentials.outputs.self-hosted }}
          SWITCHED_OFF: ${{ steps.switched-off.outputs.runs-on }}
          CHAIN: ${{ steps.chain.outputs.runs-on }}
          CHAIN_INDEX: ${{ steps.chain.outputs.index }}
          TEST_RUNS_ON: ${{ steps.pools.outputs.test-runs-on }}
          BUILD_RUNS_ON: ${{ steps.pools.outputs.build-runs-on }}
          SELECTIONS: ${{ steps.pools.outputs.selections }}
          API_ERROR: ${{ steps.api-error.outputs.runs-on }}
          API_ERROR_REASON: ${{ steps.api-error.outputs.reason }}
        run: |
          set -x
          test "$FORCED" = '["self-hosted","linux"]'
          test "$FORCED_SELF_HOSTED" = true
          test "$FALLBACK" = '["ubuntu-latest"]'
          test "$FALLBACK_SELF_HOSTED" = false
          test "$SWITCHED_OFF" = '"ubuntu-24.04"'
          test "$CHAIN" = '"ubuntu-24.04"'
          test "$CHAIN_INDEX" = 2
          test "$TEST_RUNS_ON" = '"ubuntu-24.04-arm"'
          test "$BUILD_RUNS_ON" = '"ubuntu-latest"'
          test "$(jq -r '.build.index' <<<"$SELECTIONS")" = 1
          test "$API_ERROR" = '"ubuntu-latest"'
          case "$API_ERROR_REASON" in *"HTTP 403"*) ;; *) exit 1 ;; esac

  # The outputs feed runs-on directly (plain and per-pool).
  use-output:
    needs: self-test
    strategy:
      matrix:
        runs-on: ['${{ needs.self-test.outputs.runs-on }}', '${{ needs.self-test.outputs.build }}']
    runs-on: ${{ fromJSON(matrix.runs-on) }}
    timeout-minutes: 2
    steps:
      - run: echo "running on ${{ runner.name }}"

  # Live API, success path with a token that can read runners. Add a fine-grained PAT
  # (this repository → Administration: Read) as SELECT_RUNNER_TEST_TOKEN to enable it.
  live-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_TOKEN: ${{ secrets.SELECT_RUNNER_TEST_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'
        with:
          persist-credentials: false

      - id: live
        if: env.HAS_TOKEN == 'true'
        uses: ./
        with:
          labels: self-hosted, select-runner-test-label-that-no-runner-has
          scope: repo
          fail-on-error: true
          token: ${{ secrets.SELECT_RUNNER_TEST_TOKEN }}

      - name: Assert the API answered (no matching runner → fallback)
        if: env.HAS_TOKEN == 'true'
        env:
          RUNS_ON: ${{ steps.live.outputs.runs-on }}
          REASON: ${{ steps.live.outputs.reason }}
        run: |
          test "$RUNS_ON" = '"ubuntu-latest"'
          case "$REASON" in "fallback — passed over self-hosted, select-runner-test-label-that-no-runner-has (0 idle, need 1)") ;; *) echo "$REASON"; exit 1 ;; esac

      - name: Skipped
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::live-token skipped — add the SELECT_RUNNER_TEST_TOKEN secret to run it"
